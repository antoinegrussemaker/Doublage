<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doublage de dessins animés</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0E0E;--s:#0E0E0E;--s2:#1E1E1B;--ln:#F5F5F0;--tx:#F5F5F0;--mu:#A8A8A0;--rec:#E5312B;--ye:#FFD400;--hd:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--mono:'Courier Prime','Courier New',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:16px}
#app{max-width:480px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px;min-height:100vh}
#app::before{content:'';flex:none;height:34px;border:2px solid #F5F5F0;transform:rotate(-1deg);margin-bottom:4px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='34' viewBox='0 0 32 34'><rect width='32' height='34' fill='%23F5F5F0'/><polygon points='16,0 32,0 16,34 0,34' fill='%230E0E0E'/></svg>") repeat-x}
h1{font:400 42px/1 var(--hd);letter-spacing:.03em;margin:0}
h2{font:400 26px/1 var(--hd);letter-spacing:.04em;margin:0}
p{margin:0;line-height:1.5}
.mu{color:var(--mu)}.s{font-size:13px}
button,.btn{font:400 23px/1 var(--hd);letter-spacing:.06em;min-height:52px;border-radius:0;border:2px solid #F5F5F0;background:transparent;color:var(--tx);padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center;width:100%}
button.sm,.btn.sm{min-height:44px;font-size:19px;padding:0 12px;width:auto}
.pri{background:#F5F5F0;color:#0E0E0E}
.red{border-color:var(--rec);color:var(--rec);background:transparent}
button:disabled{opacity:.35}
input[type=text],input[type=number],select,textarea{width:100%;min-height:44px;border-radius:0;border:2px solid #F5F5F0;background:transparent;color:var(--tx);padding:8px 12px;font:400 16px var(--mono)}
select option{background:#0E0E0E;color:#F5F5F0}
textarea{min-height:70px;resize:vertical}
input[type=range],input[type=checkbox]{accent-color:#FFD400}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top button{flex:none;width:44px;padding:0}
.card{background:transparent;border:2px solid #F5F5F0;border-radius:0;padding:12px;display:flex;flex-direction:column;gap:10px}
.ct{font:400 28px/1 var(--hd);letter-spacing:.04em}
.note{font-size:13px;line-height:1.5;color:var(--mu)}
.warn{background:#1E1A04;border:2px solid #FFD400;padding:10px 12px;font-size:13px;line-height:1.5;color:#FFD400}
.stage{position:relative;aspect-ratio:16/9;border:2px solid #F5F5F0;background:#000;overflow:hidden;flex:none}
.stage video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.ov{position:absolute;left:0;right:0;bottom:0;background:#0E0E0EEE;padding:8px 10px 12px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.tag{align-self:flex-start;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;color:#0E0E0E}
.sub{font:700 16px/1.3 var(--mono);color:#FFD400}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:#4A4A45}.bar i{display:block;height:100%;width:0;background:#FFD400}
.rc{position:absolute;top:10px;left:10px;background:var(--rec);color:#F5F5F0;font:400 18px/1 var(--hd);letter-spacing:.08em;padding:5px 10px;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.chip{flex:none;width:42px;height:42px;min-height:42px;border-radius:0;padding:0;font:400 24px var(--hd);border:2px solid #F5F5F0;background:transparent;color:var(--mu);letter-spacing:0}
.chip.cur{border-color:var(--rec);color:var(--rec);background:transparent}
.pills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pill{min-height:56px;font-size:30px;border-radius:0}
.pill.on{background:#F5F5F0;color:#0E0E0E}
.av{width:44px;height:44px;border-radius:0;flex:none;display:flex;align-items:center;justify-content:center;font:400 28px var(--hd);color:#0E0E0E}
.turn{flex-direction:row;align-items:center;gap:12px}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
.center b{font:400 34px/1 var(--hd);letter-spacing:.06em}
.recbtn,.stopbtn{width:92px;height:92px;min-height:92px;border-radius:50%;border:4px solid #0E0E0E;outline:3px solid #F5F5F0;padding:0;position:relative;display:block}
.recbtn{background:var(--rec)}
.recbtn::after{content:'';position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#F5F5F0}
.stopbtn{background:#0E0E0E;border-color:var(--rec)}
.stopbtn i{display:block;width:30px;height:30px;background:var(--rec);margin:auto}
.slate{display:grid;grid-template-columns:1fr .7fr 1.7fr;border:2px solid #F5F5F0}
.slate>div{padding:6px 10px;border-right:2px solid #F5F5F0;min-width:0}.slate>div:last-child{border-right:0}
.slate small{display:block;font:700 10px var(--mono);letter-spacing:.14em;color:var(--mu)}
.slate b{display:block;font:400 26px/1.05 var(--hd);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}.legend span{display:flex;align-items:center;gap:6px}.legend b{width:12px;height:12px;display:inline-block}
details summary{cursor:pointer;color:var(--mu);font-size:14px;min-height:44px;display:flex;align-items:center}
.cue{border:2px solid #F5F5F0;padding:12px;display:flex;flex-direction:column;gap:8px}
.cue label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px;flex:1}
.empty{text-align:center;color:var(--mu);padding:24px 8px;font-size:14px;border:2px dashed #4A4A45}
.two{display:flex;flex-direction:column;gap:16px}
.colA,.colB{display:flex;flex-direction:column;gap:16px;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:2px solid #F5F5F0}
.tabs button{min-height:46px;border:none;border-radius:0;font-size:22px;color:var(--mu)}
.tabs button.on{background:#F5F5F0;color:#0E0E0E}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.thumb{aspect-ratio:16/9;border:2px solid #F5F5F0;background:var(--s2) center/cover no-repeat}
.narrow{display:flex;flex-direction:column;gap:16px}
@media (min-width:700px),(orientation:landscape) and (min-width:560px){
html,body{font-size:17px}
#app{max-width:1100px;padding:24px 28px 56px}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
.colA.sticky{position:sticky;top:16px}
.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
h1{font-size:50px}
.stage{max-height:calc(100vh - 150px)}
.narrow{max-width:640px;margin:0 auto;width:100%}
.tabs{max-width:460px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var P=['#FFD400','#35C7E8','#FF8A1F','#8BE35B'];
var LEAD=2,TAIL=0.8;
var app=document.getElementById('app');
function $(s,el){return (el||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function fmt(t){t=Math.max(0,t||0);var m=Math.floor(t/60);var s=(t%60).toFixed(1);return m+':'+(s.length<4?'0'+s:s);}
function r1(x){return Math.round(x*10)/10;}
var ICO={back:'<path d="M15 5l-7 7 7 7"/>',chk:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',play:'<path d="M8 5.5v13l11-6.5z"/>',redo:'<path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',plus:'<path d="M12 5v14M5 12h14"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
function ic(k,sz,col,fill){sz=sz||20;return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="'+(fill?col:'none')+'" stroke="'+(fill?'none':col)+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICO[k]+'</svg>';}

/* ---------- stockage ---------- */
var DB=null,persist=false;
var MEM={meta:new Map(),blob:new Map()};
function openDB(){return new Promise(function(res){
  try{var r=indexedDB.open('doublage-v1',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('meta');r.result.createObjectStore('blob');};
    r.onsuccess=function(){DB=r.result;persist=true;res();};
    r.onerror=function(){res();};r.onblocked=function(){res();};
  }catch(e){res();}
  setTimeout(res,2500);
});}
function tx(store,mode,fn){return new Promise(function(res,rej){
  try{var t=DB.transaction(store,mode);var req=fn(t.objectStore(store));
    t.oncomplete=function(){res(req&&req.result);};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error);};
  }catch(e){rej(e);}
});}
function put(store,key,val){MEM[store].set(key,val);if(!DB)return Promise.resolve();return tx(store,'readwrite',function(s){return s.put(val,key);}).catch(function(){persist=false;});}
function get(store,key){if(MEM[store].has(key))return Promise.resolve(MEM[store].get(key));if(!DB)return Promise.resolve(undefined);
  return tx(store,'readonly',function(s){return s.get(key);}).then(function(v){if(v!==undefined)MEM[store].set(key,v);return v;}).catch(function(){return undefined;});}
function del(store,key){MEM[store].delete(key);if(!DB)return Promise.resolve();return tx(store,'readwrite',function(s){return s['delete'](key);}).catch(function(){});}
function keys(store){if(DB)return tx(store,'readonly',function(s){return s.getAllKeys();}).catch(function(){return Array.from(MEM[store].keys());});return Promise.resolve(Array.from(MEM[store].keys()));}

var PROJ=[];
function saveProj(p){return put('meta',p.id,JSON.parse(JSON.stringify(p)));}
function loadAll(){return keys('meta').then(function(ks){return Promise.all(ks.map(function(k){return get('meta',k);}));}).then(function(list){PROJ=list.filter(Boolean).sort(function(a,b){return (a.created||0)-(b.created||0);});});}
var VURL={};
function videoUrl(p){if(VURL[p.id])return Promise.resolve(VURL[p.id]);return get('blob','v:'+p.id).then(function(b){if(!b)return null;VURL[p.id]=URL.createObjectURL(b);return VURL[p.id];});}
function blobToAB(b){return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(f.result);};f.onerror=function(){rej(f.error);};f.readAsArrayBuffer(b);});}

/* ---------- audio ---------- */
var AC=null;
function ac(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;AC=new C();}return AC;}
function decode(ab){return new Promise(function(res,rej){var p=ac().decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej);});}
var BUF={};
function getBuf(p,c){var k=p.id+':'+c.id;if(BUF[k])return Promise.resolve(BUF[k]);
  return get('blob','r:'+k).then(function(b){if(!b)throw new Error('absent');return blobToAB(b);}).then(decode).then(function(buf){BUF[k]=buf;return buf;});}
var PL={src:[],raf:0,video:null,playing:false};
function stopAudio(){PL.src.forEach(function(s){try{s.stop();}catch(e){}});PL.src=[];}
function stopPlay(){cancelAnimationFrame(PL.raf);PL.playing=false;stopAudio();if(PL.video){try{PL.video.pause();}catch(e){}}}
function meta(v){return new Promise(function(res){if(v.readyState>=1){res();return;}v.addEventListener('loadedmetadata',function(){res();},{once:true});setTimeout(res,5000);});}
function seek(v,t){return new Promise(function(res){if(Math.abs(v.currentTime-t)<0.03){res();return;}var done=false;var f=function(){if(done)return;done=true;v.removeEventListener('seeked',f);res();};v.addEventListener('seeked',f);setTimeout(f,700);try{v.currentTime=t;}catch(e){f();}});}
function playRange(v,from,to,items,onFrame,onEnd){
  stopPlay();PL.video=v;PL.playing=true;
  var c=ac();try{c.resume();}catch(e){}
  return meta(v).then(function(){return seek(v,from);}).then(function(){
    if(!PL.playing||PL.video!==v)return;
    var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
    var t0=c.currentTime;
    items.forEach(function(it){
      if(!it.buf)return;var delay=it.at-from;var s=c.createBufferSource();s.buffer=it.buf;s.connect(c.destination);
      if(delay>=0){s.start(t0+delay);}else if(-delay<it.buf.duration){s.start(t0,-delay);}else{return;}
      PL.src.push(s);
    });
    var end=Math.min(to,isFinite(v.duration)?v.duration:to);
    var loop=function(){
      if(!PL.playing||PL.video!==v)return;
      var t=v.currentTime;if(onFrame)onFrame(t);
      if(t>=end-0.03||v.ended){stopPlay();if(onFrame)onFrame(Math.min(t,end));if(onEnd)onEnd();return;}
      PL.raf=requestAnimationFrame(loop);
    };
    PL.raf=requestAnimationFrame(loop);
  });
}
function subHTML(c,t,col){
  var w=c.text.trim().split(/\s+/).filter(Boolean);if(!w.length)return '';
  var k=0;if(t>=c.start){var pr=Math.min(1,(t-c.start)/Math.max(0.3,c.end-c.start));k=Math.floor(pr*w.length+0.35);}
  return w.map(function(x,i){return i<k?'<span style="color:#F5F5F0">'+esc(x)+'</span>':'<span>'+esc(x)+'</span>';}).join(' ');
}
function segOf(c,dur){return {a:Math.max(0,c.start-LEAD),b:Math.min(dur||1e9,c.end+TAIL)};}
function colOf(p,c){return P[(p.assign[c.char]||0)%4];}
function pname(p,c){var q=p.persons[p.assign[c.char]||0];return q?q.name:'?';}

/* ---------- navigation ---------- */
var S={view:'home',pid:null,i:0,confirm:null};
var token=0;
function cur(){for(var i=0;i<PROJ.length;i++)if(PROJ[i].id===S.pid)return PROJ[i];return null;}
function goto(view,pid,i){stopPlay();FIN.playing=false;S.view=view;if(pid)S.pid=pid;S.i=i||0;S.confirm=null;return render();}
function render(){var tk=++token;var f={home:vHome,lib:vLib,prep:vPrep,team:vTeam,seq:vSeq,fin:vFinal}[S.view];window.scrollTo(0,0);return Promise.resolve(f(tk));}

/* ---------- accueil ---------- */
function brand(){return '<div class="row" style="flex:none"><div class="av" style="background:#E5312B;border-radius:11px;width:36px;height:36px">'+ic('mic',20,'#0E0E0E')+'</div><h2 style="flex:6">Doublage</h2></div>';}
function tabsHTML(a){return '<div class="tabs"><button class="'+(a==='home'?'on':'')+'" data-act="tab" data-t="home">Extraits</button><button class="'+(a==='lib'?'on':'')+'" data-act="tab" data-t="lib">Mes doublages</button></div>';}
var THUMB={};
function thumb(p){
  if(THUMB[p.id])return Promise.resolve(THUMB[p.id]);
  return videoUrl(p).then(function(url){return new Promise(function(res){
    if(!url){res(null);return;}
    var v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
    var fin=false;function end(u){if(fin)return;fin=true;res(u);}
    setTimeout(function(){end(null);},6000);
    var t=p.cues.length?Math.max(0,p.cues[0].start):0.5;
    v.addEventListener('loadedmetadata',function(){try{v.currentTime=Math.max(0,Math.min(t,(v.duration||t)-0.1));}catch(e){end(null);}});
    v.addEventListener('seeked',function(){try{var c=document.createElement('canvas');c.width=320;c.height=180;var x=c.getContext('2d');var w=v.videoWidth||320,h=v.videoHeight||180;var r=Math.min(320/w,180/h);x.fillStyle='#000';x.fillRect(0,0,320,180);x.drawImage(v,(320-w*r)/2,(180-h*r)/2,w*r,h*r);var u=c.toDataURL('image/jpeg',0.6);THUMB[p.id]=u;end(u);}catch(e){end(null);}});
  });});
}
function vLib(){
  stopPlay();
  var list=PROJ.filter(function(p){return done(p)>0;});
  var cards=list.map(function(p){
    var d=done(p),n=p.cues.length,full=d===n;
    var who=p.persons.map(function(q){return esc(q.name);}).join(', ');
    return '<div class="card"><div class="thumb" data-th="'+p.id+'"></div><div class="ct">'+esc(p.title)+'</div><div class="note">'+(full?'Doublage complet':d+' séquence'+(d>1?'s':'')+' sur '+n)+' · '+who+'</div>'+
      '<div class="row"><button class="pri sm" data-act="fin" data-id="'+p.id+'">'+ic('play',18,'#0E0E0E',true)+' Lecture</button>'+(full?'':'<button class="sm" data-act="resume" data-id="'+p.id+'">Continuer</button>')+'</div></div>';
  }).join('');
  app.innerHTML=brand()+tabsHTML('lib')+'<h1>Mes doublages</h1><p class="mu">Les extraits où au moins une séquence est enregistrée.</p>'+
    (cards?'<div class="grid">'+cards+'</div>':'<div class="empty">Aucun doublage enregistré pour l\u2019instant. Ajoute un extrait, puis enregistre au moins une séquence.</div>');
  list.forEach(function(p){thumb(p).then(function(u){var el=$('[data-th="'+p.id+'"]');if(el&&u)el.style.backgroundImage='url('+u+')';});});
}
function done(p){return p.cues.filter(function(c){return c.rec;}).length;}
function vHome(){
  var cards=PROJ.map(function(p){
    var d=done(p),n=p.cues.length;
    var st=n?(d+' séquence'+(d>1?'s':'')+' enregistrée'+(d>1?'s':'')+' sur '+n):'Répliques à préparer';
    return '<div class="card"><div class="ct">'+esc(p.title)+'</div><div class="note">'+st+'</div>'+
      '<div class="row"><button class="sm" data-act="prep" data-id="'+p.id+'">Répliques</button><button class="sm" data-act="team" data-id="'+p.id+'"'+(n?'':' disabled')+'>Doubler</button><button class="sm" data-act="fin" data-id="'+p.id+'"'+(d?'':' disabled')+'>Lecture</button>'+
      '<button class="sm red" data-act="del" data-id="'+p.id+'" aria-label="Supprimer l’extrait">'+(S.confirm===p.id?'Sûr ?':ic('trash',18,'#E5312B'))+'</button></div></div>';
  }).join('');
  app.innerHTML=brand()+tabsHTML('home')+
   '<h1>Tes extraits</h1><p class="mu">Charge un extrait, ajoute les répliques, puis doublez-les séquence par séquence.</p>'+
   (persist?'':'<div class="warn">La sauvegarde automatique n’est pas disponible ici : tes extraits disparaîtront si tu fermes la page.</div>')+
   (cards?'<div class="grid">'+cards+'</div>':'<div class="empty">Aucun extrait pour l\u2019instant.</div>')+
   '<label class="btn pri">'+ic('plus',20,'#0E0E0E')+' Ajouter un extrait<input type="file" accept="video/*" id="addv" hidden></label>';
}

/* ---------- préparation des répliques ---------- */
function sortCues(p){p.cues.sort(function(a,b){return a.start-b.start;});}
function vPrep(tk){
  var p=cur();if(!p)return goto('home');
  return videoUrl(p).then(function(url){
    if(tk!==token)return;
    app.innerHTML='<div class="top"><button data-act="home" aria-label="Retour">'+ic('back',22,'#F5F5F0')+'</button><div style="flex:1"><input type="text" id="ttl" aria-label="Titre de l’extrait" value="'+esc(p.title)+'"></div></div>'+
     '<div class="two"><div class="colA sticky"><div class="stage"><video id="v" controls playsinline preload="auto" src="'+url+'"></video></div>'+
     '<div class="row"><button data-act="addcue">'+ic('plus',18,'#F5F5F0')+' Réplique ici</button><label class="btn" style="font-size:15px">Importer .srt<input type="file" accept=".srt,text/plain,application/x-subrip" id="srt" hidden></label></div>'+
     '<p class="note">Lance la vidéo, mets en pause là où le personnage commence à parler, puis touche « Réplique ici ». Écris ce qu’il doit dire. Si tu as un fichier de sous-titres (.srt), importe-le : les répliques se remplissent toutes seules.</p></div><div class="colB">'+
     '<h2>Personnages</h2><div id="chars"></div>'+
     '<h2>Répliques</h2><div id="cues"></div>'+
     '<label class="row note" style="gap:10px;align-items:center"><input type="checkbox" id="keep" style="flex:none;width:22px;height:22px"'+(p.keep?' checked':'')+'><span>Garder le son de la vidéo pendant le doublage (si les voix sont déjà retirées)</span></label>'+
     '<button class="pri" data-act="toteam">Continuer</button><div id="pmsg" class="note"></div></div></div>';
    renderChars(p);renderCues(p);
  });
}
function renderChars(p){
  $('#chars').innerHTML='<div style="display:flex;flex-direction:column;gap:8px">'+p.chars.map(function(n,i){
    return '<div class="row"><input type="text" data-f="char" data-ci="'+i+'" aria-label="Nom du personnage '+(i+1)+'" value="'+esc(n)+'">'+(p.chars.length>1?'<button class="sm" style="flex:none" data-act="rmchar" data-ci="'+i+'" aria-label="Retirer ce personnage">'+ic('x',18,'#F5F5F0')+'</button>':'')+'</div>';

function renderCues(p){

      '<button class="sm" style="flex:none" data-act="seekcue">Voir</button><button class="sm red" style="flex:none" data-act="delcue" aria-label="Supprimer la réplique">'+ic('trash',18,'#E5312B')+'</button></div>'+
      '<textarea data-f="text" aria-label="Texte de la réplique" placeholder="Ce que dit le personnage">'+esc(c.text)+'</textarea></div>';
  }).join('')+'</div>';

function parseSrt(txt){
  var out=[];
  txt.replace(/\r/g,'').split(/\n\s*\n/).forEach(function(b){
    var L=b.trim().split('\n');var i=-1;for(var k=0;k<L.length;k++){if(L[k].indexOf('-->')>=0){i=k;break;}}
    if(i<0)return;
    var m=L[i].match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);if(!m)return;
    function T(h,mi,s,ms){return (+h)*3600+(+mi)*60+(+s)+(+('0.'+ms));}
    var text=L.slice(i+1).join(' ').replace(/<[^>]+>/g,'').replace(/\{[^}]*\}/g,'').replace(/\s+/g,' ').trim();
    if(text)out.push({start:T(m[1],m[2],m[3],m[4]),end:T(m[5],m[6],m[7],m[8]),text:text});
  });
  return out;
}

function micMsg(){return 'Le micro est bloqué dans cette page. Enregistre ta voix avec l’app Dictaphone de ton iPhone (lance-la, reviens ici, joue la scène, puis arrête-la), importe le fichier et règle le décalage si besoin.';}
function curCtx(){var p=cur();var c=p.cues[S.i];var v=$('#v');var sg=segOf(c,v?v.duration:0);return {p:p,c:c,v:v,sg:sg,col:colOf(p,c)};}

function ctl(){

  }

function saveVoice(p,c,blob){
  return put('blob','r:'+p.id+':'+c.id,blob).then(function(){
    delete BUF[p.id+':'+c.id];c.rec=true;c.off=0;c.takes=(c.takes||0)+1;return saveProj(p);
  }).then(function(){return getBuf(p,c);}).then(function(){SQ.mode='review';SQ.msg='';},function(){
    c.rec=false;saveProj(p);SQ.mode='ready';SQ.msg='Ce fichier audio n’est pas lisible. Refais l’enregistrement ou importe un autre fichier.';
  });
}
function doRecord(){
  var x=curCtx();var p=x.p,c=x.c,v=x.v;
  try{ac().resume();}catch(e){}
  var getMic=function(){
    if(STREAM)return Promise.resolve(STREAM);
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder))return Promise.reject(new Error('nomic'));
    return navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){STREAM=s;return s;});
  };
  getMic().then(function(stream){
    var mime='';['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].forEach(function(m){if(!mime&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))mime=m;});
    var rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    var chunks=[];
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
    rec.onstop=function(){
      $('#rc').style.display='none';
      var blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/mp4'});
      saveVoice(p,c,blob).then(function(){if(S.view==='seq')renderSeqChips();ctl();});
    };
    SQ.mode='rec';SQ.msg='';ctl();$('#rc').style.display='block';v.muted=true;
    SQ.stop=function(){stopPlay();if(rec.state!=='inactive')rec.stop();};
    playRange(v,x.sg.a,x.sg.b,[],frame,function(){if(rec.state!=='inactive')rec.stop();}).then(function(){if(rec.state==='inactive'&&SQ.mode==='rec')rec.start();});
  }).catch(function(){MICBLOCK=true;SQ.mode='ready';SQ.msg=micMsg();ctl();});
}
function renderSeqChips(){var p=cur();var old=$('.chips');if(old){var d=document.createElement('div');d.innerHTML=chipsHTML(p,S.i);old.parentNode.replaceChild(d.firstChild,old);}}
function listen(){
  var x=curCtx();x.v.muted=!x.p.keep;SQ.mode='play';ctl();
  getBuf(x.p,x.c).then(function(buf){
    return playRange(x.v,x.sg.a,x.sg.b,[{buf:buf,at:x.sg.a+(x.c.off||0)}],frame,function(){SQ.mode=x.c.rec?'review':'ready';ctl();});
  }).catch(function(){SQ.mode='review';SQ.msg='Impossible de lire cet enregistrement.';ctl();});
}
function preview(){var x=curCtx();x.v.muted=!x.p.keep;SQ.mode='play';ctl();playRange(x.v,x.sg.a,x.sg.b,[],frame,function(){SQ.mode=x.c.rec?'review':'ready';ctl();});}

function fdraw(t){

function fbtn(playing){var b=$('#fp');if(b)b.innerHTML=playing?ic('x',22,'#0E0E0E')+' Arrêter':ic('play',22,'#0E0E0E',true)+' Lecture';}
function fplay(from){
  var p=cur();var v=$('#v');var d=v.duration||0;if(from>=d-0.2)from=0;
  var jobs=p.cues.filter(function(c){return c.rec;}).map(function(c){return getBuf(p,c).then(function(buf){return {buf:buf,at:segOf(c,d).a+(c.off||0)};}).catch(function(){return null;});});
  FIN.playing=true;fbtn(true);try{ac().resume();}catch(e){}
  Promise.all(jobs).then(function(items){
    return playRange(v,from,d,items.filter(Boolean),fdraw,function(){FIN.playing=false;fbtn(false);});
  });

/* ---------- événements ---------- */
function onAct(el){
  var a=el.getAttribute('data-act');var id=el.getAttribute('data-id');var p=cur();
  if(a==='home')return goto('home');
  if(a==='lib')return goto('lib');
  if(a==='tab')return goto(el.getAttribute('data-t'));
  if(a==='resume'){var rp=PROJ.filter(function(x){return x.id===id;})[0];var r0=0;for(var q=0;q<rp.cues.length;q++){if(!rp.cues[q].rec){r0=q;break;}}return goto('seq',id,r0);}
  if(a==='prep')return goto('prep',id);
  if(a==='team'){var q=PROJ.filter(function(x){return x.id===id;})[0];return goto(q&&q.persons&&q.persons.length?'team':'team',id);}
  if(a==='fin')return goto('fin',id);
  if(a==='del'){if(S.confirm===id){return deleteProj(id);}S.confirm=id;return vHome();}
  if(a==='addcue'){var v=$('#v');var t=v?v.currentTime:0;var d=v&&isFinite(v.duration)?v.duration:t+3;var c={id:uid(),start:t,end:Math.min(d,t+3),char:0,text:'',rec:false,off:0};p.cues.push(c);sortCues(p);saveProj(p);renderCues(p);var ta=$('[data-cid="'+c.id+'"] textarea');if(ta)ta.focus();return;}
  if(a==='addchar'){p.chars.push('Personnage '+(p.chars.length+1));p.assign.push(0);saveProj(p);renderChars(p);renderCues(p);return;}
  if(a==='rmchar'){var ci=+el.getAttribute('data-ci');p.chars.splice(ci,1);p.assign.splice(ci,1);p.cues.forEach(function(c){if(c.char===ci)c.char=0;else if(c.char>ci)c.char--;});setN(p,p.persons.length);renderChars(p);renderCues(p);return;}
  var cueEl=el.closest?el.closest('[data-cid]'):null;var cue=null;if(cueEl){var cid=cueEl.getAttribute('data-cid');cue=p.cues.filter(function(c){return c.id===cid;})[0];}
  if(a==='setstart'&&cue){var v1=$('#v');cue.start=r1(v1.currentTime);if(cue.end<=cue.start)cue.end=cue.start+2;sortCues(p);saveProj(p);return renderCues(p);}
  if(a==='setend'&&cue){var v2=$('#v');cue.end=r1(v2.currentTime);saveProj(p);return renderCues(p);}
  if(a==='seekcue'&&cue){var v3=$('#v');v3.currentTime=Math.max(0,cue.start-0.5);return;}
  if(a==='delcue'&&cue){if(el.getAttribute('data-sure')!=='1'){el.setAttribute('data-sure','1');el.textContent='Sûr ?';return;}p.cues=p.cues.filter(function(c){return c!==cue;});del('blob','r:'+p.id+':'+cue.id);saveProj(p);return renderCues(p);}
  if(a==='toteam'){if(!p.cues.length){$('#pmsg').textContent='Ajoute au moins une réplique pour continuer.';return;}if(p.cues.some(function(c){return !c.text.trim();})){$('#pmsg').textContent='Certaines répliques n’ont pas de texte.';return;}return goto('team');}
  if(a==='n'){setN(p,+el.getAttribute('data-n'));return vTeam();}
  if(a==='go'){var i0=0;for(var k=0;k<p.cues.length;k++){if(!p.cues[k].rec){i0=k;break;}}return goto('seq',null,i0);}
  if(a==='totem')return goto('team');
  if(a==='jump'){var j=+el.getAttribute('data-j');return goto('seq',null,j);}
  if(a==='rec')return doRecord();
  if(a==='stoprec'){if(SQ.stop)SQ.stop();return;}
  if(a==='stopplay'){stopPlay();var cc=p.cues[S.i];SQ.mode=cc.rec?'review':'ready';ctl();return;}
  if(a==='preview')return preview();
  if(a==='listen')return listen();
  if(a==='redo'){SQ.mode='ready';SQ.msg='';ctl();return;}
  if(a==='keepold'){SQ.mode='review';ctl();return;}
  if(a==='nud'){var c2=p.cues[S.i];c2.off=r1((c2.off||0)+parseFloat(el.getAttribute('data-d')));saveProj(p);return ctl();}
  if(a==='next'){if(S.i<p.cues.length-1)return goto('seq',null,S.i+1);return goto('fin');}
  if(a==='fplay'){if(FIN.playing){stopPlay();FIN.playing=false;fbtn(false);}else{fplay($('#v').currentTime);}return;}
  if(a==='frestart'){fplay(0);return;}
}
function deleteProj(id){
  var p=PROJ.filter(function(x){return x.id===id;})[0];if(!p)return;
  PROJ=PROJ.filter(function(x){return x.id!==id;});
  del('meta',id);del('blob','v:'+id);p.cues.forEach(function(c){del('blob','r:'+id+':'+c.id);});
  if(VURL[id]){URL.revokeObjectURL(VURL[id]);delete VURL[id];}
  S.confirm=null;vHome();
}

  if(el.id==='ttl'){p.title=el.value;saveProj(p);return;}
  if(f==='text'){var c=p.cues.filter(function(x){return x.id===el.closest('[data-cid]').getAttribute('data-cid');})[0];if(c){c.text=el.value;saveProj(p);}}
  if(f==='char'&&el.hasAttribute('data-ci')){p.chars[+el.getAttribute('data-ci')]=el.value;saveProj(p);}
  if(f==='pname'){p.persons[+el.getAttribute('data-pi')].name=el.value;saveProj(p);}
});
app.addEventListener('change',function(e){
  var el=e.target;var f=el.getAttribute&&el.getAttribute('data-f');var p=cur();
  if(el.id==='addv'&&el.files&&el.files[0]){
    var file=el.files[0];var np={id:uid(),title:file.name.replace(/\.[^.]+$/,'')||'Extrait',chars:['Personnage 1','Personnage 2'],persons:[{name:'Doubleur 1'}],assign:[0,0],cues:[],keep:false,created:Date.now()};
    put('blob','v:'+np.id,file).then(function(){PROJ.push(np);return saveProj(np);}).then(function(){goto('prep',np.id);});return;
  }
  if(el.id==='srt'&&el.files&&el.files[0]){
    el.files[0].text?el.files[0].text().then(importSrt):new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsText(el.files[0]);}).then(importSrt);
    function importSrt(txt){var list=parseSrt(txt);var m=$('#pmsg');if(!list.length){m.textContent='Aucune réplique trouvée dans ce fichier.';return;}list.forEach(function(x){p.cues.push({id:uid(),start:x.start,end:x.end,char:0,text:x.text,rec:false,off:0});});sortCues(p);saveProj(p);renderCues(p);m.textContent=list.length+' répliques importées. Vérifie le personnage de chacune.';}
    el.value='';return;
  }
  if(el.id==='keep'&&p){p.keep=el.checked;saveProj(p);return;}
  if(el.id==='imp'&&el.files&&el.files[0]){
    var x=curCtx();SQ.msg='Import en cours…';ctl();
    saveVoice(x.p,x.c,el.files[0]).then(function(){renderSeqChips();ctl();});return;
  }
  if(!p)return;
  if(f==='start'||f==='end'){var c=p.cues.filter(function(q){return q.id===el.closest('[data-cid]').getAttribute('data-cid');})[0];if(c){var val=parseFloat(el.value);if(!isNaN(val)){c[f]=Math.max(0,val);if(c.end<=c.start)c.end=c.start+1;sortCues(p);saveProj(p);renderCues(p);}}}
  if(f==='char'&&el.closest('[data-cid]')){var c3=p.cues.filter(function(q){return q.id===el.closest('[data-cid]').getAttribute('data-cid');})[0];if(c3){c3.char=+el.value;saveProj(p);renderCues(p);}}
  if(f==='char'&&el.hasAttribute('data-ci')){renderCues(p);}
  if(f==='assign'){p.assign[+el.getAttribute('data-ci')]=+el.value;saveProj(p);vTeam();}
  if(f==='pname'){vTeam();}
});
app.addEventListener('input',function(e){var el=e.target;if(el.id==='sk'){var v=$('#v');var t=parseFloat(el.value);if(FIN.playing){fplay(t);}else{v.currentTime=t;fdraw(t);}}});
document.addEventListener('visibilitychange',function(){if(document.hidden){stopPlay();FIN.playing=false;if(S.view==='seq'&&SQ.mode!=='rec'){var p=cur();if(p&&p.cues[S.i]){SQ.mode=p.cues[S.i].rec?'review':'ready';ctl();}}}});

openDB().then(loadAll).then(function(){render();});
})();
</script>
